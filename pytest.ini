[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests requiring network access (normally skipped)
    optional: marks tests requiring the optional tier (streamlit/plotly) — OPT_ONLY
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
